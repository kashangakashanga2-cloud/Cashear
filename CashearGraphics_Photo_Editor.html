<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Cashear Graphics Photo Editor</title>
<style>
:root{--bg:#101216;--card:#1b1e24;--text:#f5f5f5;--muted:#aeb4bf;--accent:#ffd21c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px}.brand{font-size:25px;font-weight:800;margin:4px 0 14px}.brand span{color:var(--accent)}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px}
input[type=file]{width:100%;padding:14px;border:1px dashed #68707c;border-radius:12px;background:#111318;color:var(--text)}
.preview{width:100%;max-height:55vh;object-fit:contain;background:#090a0d;border-radius:14px;display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}
input[type=range]{width:100%}
button{min-height:46px;border:0;border-radius:12px;padding:10px 14px;font-weight:700;background:#30353d;color:#fff}
button.primary{background:var(--accent);color:#111}button:disabled{opacity:.45}
.row{display:flex;gap:9px;flex-wrap:wrap}.row button{flex:1;min-width:120px}
#status{color:var(--muted);font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span>Cashear</span> Graphics</div>
  <div class="card">
    <input id="file" type="file" accept="image/*">
    <div id="status">Choose a photo to begin.</div>
  </div>
  <div class="card">
    <canvas id="canvas" class="preview" aria-label="Edited photo preview"></canvas>
  </div>
  <div class="card">
    <div class="grid">
      <div><label for="bright">Brightness <output id="brightOut">100%</output></label><input id="bright" type="range" min="50" max="160" value="100"></div>
      <div><label for="contrast">Contrast <output id="contrastOut">100%</output></label><input id="contrast" type="range" min="50" max="160" value="100"></div>
      <div><label for="sat">Saturation <output id="satOut">100%</output></label><input id="sat" type="range" min="0" max="180" value="100"></div>
      <div><label for="gray">Grayscale <output id="grayOut">0%</output></label><input id="gray" type="range" min="0" max="100" value="0"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="rotate">Rotate</button>
      <button id="reset">Reset</button>
    </div>
  </div>
  <div class="card">
    <label for="caption">Add text</label>
    <input id="caption" type="text" placeholder="Cashear Graphics" style="width:100%;padding:13px;border-radius:10px;border:1px solid #555;background:#111318;color:white">
    <div class="row" style="margin-top:10px">
      <button id="addText">Add text</button>
      <button id="download" class="primary" disabled>Save photo</button>
    </div>
  </div>
</div>
<script>
const file=document.getElementById('file'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const bright=document.getElementById('bright'),contrast=document.getElementById('contrast'),sat=document.getElementById('sat'),gray=document.getElementById('gray');
const status=document.getElementById('status'),download=document.getElementById('download');
let img=null, angle=0, textItems=[];
function vals(){return [bright,contrast,sat,gray].map(x=>+x.value)}
function draw(){
  if(!img){ctx.clearRect(0,0,canvas.width,canvas.height);return}
  const rad=angle*Math.PI/180, swap=angle%180!==0;
  canvas.width=swap?img.height:img.width; canvas.height=swap?img.width:img.height;
  ctx.save();ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rad);
  ctx.filter=`brightness(${bright.value}%) contrast(${contrast.value}%) saturate(${sat.value}%) grayscale(${gray.value}%)`;
  ctx.drawImage(img,-img.width/2,-img.height/2);ctx.filter='none';ctx.restore();
  ctx.font=Math.max(22,Math.round(canvas.width/18))+'px system-ui';
  ctx.textAlign='center';ctx.textBaseline='bottom';
  for(const t of textItems){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillText(t,canvas.width/2+2,canvas.height-28+2);ctx.fillStyle='#fff';ctx.fillText(t,canvas.width/2,canvas.height-28)}
}
function update(){document.getElementById('brightOut').textContent=bright.value+'%';document.getElementById('contrastOut').textContent=contrast.value+'%';document.getElementById('satOut').textContent=sat.value+'%';document.getElementById('grayOut').textContent=gray.value+'%';draw()}
[file,bright,contrast,sat,gray].forEach(e=>e.addEventListener(e===file?'change':'input',e===file?()=>{
 const f=file.files[0]; if(!f)return; const r=new FileReader();r.onload=()=>{img=new Image();img.onload=()=>{angle=0;textItems=[];download.disabled=false;status.textContent='Photo loaded. Make your edits!';update()};img.src=r.result};r.readAsDataURL(f)
}:update));
document.getElementById('rotate').onclick=()=>{if(!img)return;angle=(angle+90)%360;draw()};
document.getElementById('reset').onclick=()=>{bright.value=100;contrast.value=100;sat.value=100;gray.value=0;angle=0;textItems=[];update();status.textContent=img?'Edits reset.':'Choose a photo to begin.'};
document.getElementById('addText').onclick=()=>{if(!img)return;const t=document.getElementById('caption').value.trim();if(!t)return;textItems.push(t);document.getElementById('caption').value='';draw()};
download.onclick=()=>{if(!img)return;const a=document.createElement('a');a.download='Cashear-Graphics.jpg';a.href=canvas.toDataURL('image/jpeg',.94);a.click();status.textContent='Your edited photo is ready.'};
</script>
</body>
</html>
